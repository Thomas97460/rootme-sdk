version: '3'
tasks:
  format:
    cmds: [uv run ruff check --fix ., uv run ruff format .]
  format-check:
    cmds: [uv run ruff format --check .]
  lint:
    cmds: [uv run ruff check .]
  typecheck:
    cmds: [uv run mypy]
  docstrings:
    cmds: [uv run interrogate -c pyproject.toml src/rootme_sdk]
  test-unit:
    cmds: [uv run pytest tests/unit --cov=rootme_sdk --cov-report=term-missing --cov-fail-under=100]
  test-scenarios:
    cmds: [uv run pytest tests/scenarios]
  test-packaging:
    cmds: [uv run pytest tests/packaging]
  audit:
    cmds:
      - uv export --locked --no-dev --no-emit-project --no-hashes -o .audit-requirements.txt
      - defer: uv run python -c 'from pathlib import Path; Path(".audit-requirements.txt").unlink(missing_ok=True)'
      - uv run pip-audit --strict --disable-pip --no-deps -r .audit-requirements.txt
  secrets:
    cmds: [gitleaks git --redact --no-banner --log-opts=--all]
  build:
    cmds: [uv build --clear, uv run twine check dist/*, uv run python -m scripts.check_distributions]
  ci:
    cmds:
      - task: format-check
      - task: lint
      - task: typecheck
      - task: docstrings
      - task: test-unit
      - task: test-scenarios
      - task: test-packaging
      - task: build
