name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra browser
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run interrogate -c pyproject.toml src/rootme_sdk
      - run: uv run pytest tests/unit --cov=rootme_sdk --cov-report=term-missing --cov-fail-under=100
      - run: uv run pytest tests/scenarios
      - run: uv build --clear
      - run: uv run twine check dist/*
      - run: uv run python scripts/check_distributions.py
  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          import re
          pattern = r'^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert)(\([^)]+\))?!?: .+'
          if not re.fullmatch(pattern, os.environ['PR_TITLE']):
              raise SystemExit('PR title must be a Conventional Commit')
          PY
