[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rootme-sdk"
version = "0.6.0"

description = "Unofficial typed Python SDK for Root-Me accounts and challenges"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thomas Collet"}]
keywords = ["root-me", "sdk", "ctf", "challenges"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "playwright>=1.55,<2"]

[project.urls]
Repository = "https://github.com/Thomas97460/rootme-sdk"
Documentation = "https://github.com/Thomas97460/rootme-sdk/blob/main/API.md"
Issues = "https://github.com/Thomas97460/rootme-sdk/issues"
Changelog = "https://github.com/Thomas97460/rootme-sdk/releases"

[project.optional-dependencies]
# Preserve the published extra; browser support is now installed by default.
browser = []

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18", "pytest>=8.4", "pytest-cov>=7", "interrogate>=1.7", "twine>=6", "pip-audit>=2.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/rootme_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "/*.md", "LICENSE", "pyproject.toml", "uv.lock", "Taskfile.yml"]
exclude = ["/.github"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe contracts; docstring coverage applies to the SDK.
"tests/**" = ["D"]
# This file only re-exports the public API, as required by AGENTS.md.
"src/rootme_sdk/**/__init__.py" = ["D104"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src/rootme_sdk"]

[tool.interrogate]
fail-under = 100
ignore-init-module = true
ignore-magic = false
exclude = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"


[tool.coverage.run]
source = ["rootme_sdk"]

[tool.coverage.report]
fail_under = 100
show_missing = true
